<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch Web Application</title>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        rgba(9,9,121,0.5),
        rgba(58,12,163,0.5)
    ),
    url("stopwatch back.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    overflow:hidden;
}

/* Background Effects */

body::before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background:rgba(255,255,255,0.1);
    border-radius:50%;
    top:-80px;
    left:-80px;
    filter:blur(20px);
}

body::after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:rgba(0,255,255,0.15);
    border-radius:50%;
    bottom:-100px;
    right:-100px;
    filter:blur(25px);
}

/* Main Card */

.container{
    position:relative;
    z-index:1;

    width:420px;

    padding:35px;

    border-radius:25px;

    background:rgba(255,255,255,0.12);

    backdrop-filter:blur(20px);

    box-shadow:0 10px 40px rgba(0,0,0,0.4);

    color:white;

    text-align:center;
}

h1{
    margin-bottom:20px;
    font-size:38px;
}

/* Timer Display */

#display{
    font-size:55px;
    font-weight:bold;
    margin-bottom:25px;
    text-shadow:0 0 15px cyan;
}

/* Buttons */

.buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    color:white;
    font-size:15px;
    transition:0.3s;
}

button:hover{
    transform:translateY(-4px);
}

.start{
    background:#00c853;
}

.pause{
    background:#ff9800;
}

.reset{
    background:#ff1744;
}

.lap{
    background:#2196f3;
}

/* Lap Records */

#laps{
    margin-top:25px;
    max-height:180px;
    overflow-y:auto;
}

#laps h3{
    margin-bottom:10px;
}

#lapList{
    list-style:none;
}

#lapList li{
    background:rgba(255,255,255,0.1);
    padding:8px;
    margin:6px 0;
    border-radius:8px;
}

/* Scrollbar */

#laps::-webkit-scrollbar{
    width:6px;
}

#laps::-webkit-scrollbar-thumb{
    background:white;
    border-radius:10px;
}

@media (max-width: 500px){

.container{
    width:90%;
    padding:20px;
}

#display{
    font-size:40px;
}

button{
    width:100%;
}

.buttons{
    flex-direction:column;
}
}
</style>

</head>

<body>

<div class="container">

<h1>⏱ Stopwatch</h1>

<div id="display">00:00:00</div>

<div class="buttons">

<button class="start" onclick="startTimer()">
Start
</button>

<button class="pause" onclick="pauseTimer()">
Pause
</button>

<button class="reset" onclick="resetTimer()">
Reset
</button>

<button class="lap" onclick="saveLap()">
Lap
</button>

</div>

<div id="laps">
<h3>Lap Records</h3>
<ul id="lapList"></ul>
</div>

</div>

<script>

let hours = 0;
let minutes = 0;
let seconds = 0;

let timer = null;
let lapCounter = 1;

/* Update Display */

function updateDisplay(){

document.getElementById("display").innerHTML =

String(hours).padStart(2,'0')
+ ":"
+
String(minutes).padStart(2,'0')
+ ":"
+
String(seconds).padStart(2,'0');

}

/* Stopwatch Logic */

function runStopwatch(){

seconds++;

if(seconds === 60){
    seconds = 0;
    minutes++;
}

if(minutes === 60){
    minutes = 0;
    hours++;
}

updateDisplay();

}

/* Start */

function startTimer(){

if(timer !== null)
return;

timer = setInterval(
runStopwatch,
1000
);

}

/* Pause */

function pauseTimer(){

clearInterval(timer);

timer = null;

}

/* Reset */

function resetTimer(){

clearInterval(timer);

timer = null;

hours = 0;
minutes = 0;
seconds = 0;

lapCounter = 1;

document.getElementById("lapList").innerHTML = "";

updateDisplay();

}

/* Save Lap */

function saveLap(){

if(hours===0 &&
minutes===0 &&
seconds===0){
return;
}

let currentTime =

String(hours).padStart(2,'0')
+ ":"
+
String(minutes).padStart(2,'0')
+ ":"
+
String(seconds).padStart(2,'0');

let li = document.createElement("li");

li.innerHTML =
"Lap " +
lapCounter +
" : " +
currentTime;

document
.getElementById("lapList")
.appendChild(li);

lapCounter++;

}

</script>

</body>
</html>
